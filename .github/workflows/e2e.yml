          done
          echo "::error::Playground failed to boot (wp-post-image + author nicename) after 3 attempts; aborting so the suite does not run against a mis-seeded site."
          exit 1

      - name: Run per-style axe sweep
        working-directory: tests
        run: npx playwright test --config playwright.styles.config.js
        env:
          DIRTBAG_BASE_URL: http://127.0.0.1:9400
          DIRTBAG_STYLE: ${{ matrix.style }}

      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: playwright-report-${{ matrix.style }}
          path: tests/playwright-report
          retention-days: 7
