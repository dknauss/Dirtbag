name: E2E

# Boots WordPress 7.0 in WordPress Playground with the theme + seeded demo
# content, then runs the Playwright smoke + accessibility suite against it.

on:
  # Skip the Playground browser suite for docs-only changes: prose, planning
  # notes, and patch artifacts can't affect what the theme renders, and the
  # Playground CLI is flaky enough that running it on docs adds noise, not
  # signal. A change touching any non-doc path still triggers the full suite.
  # (These checks are not required, so skipping never blocks a merge.)
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '.planning/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '.planning/**'
      - '**/*.md'

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  browser-environment:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      image: ${{ steps.browser.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Test browser image selection
        run: node --test tests/ci-browser-environment.test.mjs
      - name: Select the image matching package-lock.json
        id: browser
        run: node tests/ci-browser-environment.mjs >> "$GITHUB_OUTPUT"

  e2e:
    needs: browser-environment
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: ${{ needs.browser-environment.outputs.image }}
      options: --init --ipc=host
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          check-latest: true

      - name: Generate default CI blueprint
        env:
          REF: ${{ github.event.pull_request.head.sha || github.sha }}
          STYLE: default
        run: node tests/ci-style-blueprint.mjs > tests/blueprint.ci.json

      - name: Read intended runtime versions
        id: runtime
        run: node tests/ci-versions.mjs >> "$GITHUB_OUTPUT"

      - name: Test CI verification guards
        run: node --test tests/ci-state.test.mjs

      - name: Test shared boot runner
        run: node --test tests/boot-playground.test.mjs

      - name: Install test dependencies
        working-directory: tests
        run: npm ci
        timeout-minutes: 5

      - name: Verify baked Chromium and WebKit
        timeout-minutes: 2
        run: node tests/assert-ci-browsers.mjs

      - name: Boot WordPress Playground (theme + seeded content)
        env:
          WP_VERSION: ${{ steps.runtime.outputs.wp }}
          PHP_VERSION: ${{ steps.runtime.outputs.php }}
        run: bash .github/scripts/boot-playground.sh tests/blueprint.ci.json "$WP_VERSION" "$PHP_VERSION"

      - name: Verify actual runtime and saved style
        run: node tests/assert-ci-state.mjs
        env:
          DIRTBAG_BASE_URL: http://127.0.0.1:9400
          DIRTBAG_STYLE: default

      - name: Run Playwright (smoke + accessibility)
        working-directory: tests
        run: npm test
        env:
          DIRTBAG_BASE_URL: http://127.0.0.1:9400

      - name: Verify runtime and style remained pinned throughout the suite
        run: node tests/assert-ci-state.mjs
        env:
          DIRTBAG_BASE_URL: http://127.0.0.1:9400
          DIRTBAG_STYLE: default

      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: |
            tests/playwright-report
            tests/test-results
            ${{ runner.temp }}/dirtbag-playground
          retention-days: 7

  # Per-style accessibility sweep — axe (with color-contrast gated) against each
  # style variation. Playground is in-memory with no persistent wp-cli, so each
  # style gets its own boot: the blueprint applies the variation at boot via
  # playground/apply-style.php (locally this is the tests/axe-styles.sh loop).
  e2e-styles:
    needs: browser-environment
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: ${{ needs.browser-environment.outputs.image }}
      options: --init --ipc=host
    strategy:
      fail-fast: false
      matrix:
        style: [default, terminal, amber-crt, blueprint, hi-vis, minimalist, newspaper]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          check-latest: true

      - name: Generate per-style CI blueprint
        env:
          REF: ${{ github.event.pull_request.head.sha || github.sha }}
          STYLE: ${{ matrix.style }}
        run: node tests/ci-style-blueprint.mjs > tests/blueprint.ci.json

      - name: Read intended runtime versions
        id: runtime
        run: node tests/ci-versions.mjs >> "$GITHUB_OUTPUT"

      - name: Test CI verification guards
        run: node --test tests/ci-state.test.mjs

      - name: Install test dependencies
        working-directory: tests
        run: npm ci
        timeout-minutes: 5

      - name: Verify baked Chromium and WebKit
        timeout-minutes: 2
        run: node tests/assert-ci-browsers.mjs

      - name: Boot WordPress Playground (theme + seed + style)
        env:
          WP_VERSION: ${{ steps.runtime.outputs.wp }}
          PHP_VERSION: ${{ steps.runtime.outputs.php }}
        run: bash .github/scripts/boot-playground.sh tests/blueprint.ci.json "$WP_VERSION" "$PHP_VERSION"

      - name: Verify actual runtime and saved style
        run: node tests/assert-ci-state.mjs
        env:
          DIRTBAG_BASE_URL: http://127.0.0.1:9400
          DIRTBAG_STYLE: ${{ matrix.style }}

      - name: Run per-style axe sweep
        working-directory: tests
        run: npx playwright test --config playwright.styles.config.js
        env:
          DIRTBAG_BASE_URL: http://127.0.0.1:9400
          DIRTBAG_STYLE: ${{ matrix.style }}

      - name: Verify runtime and style remained pinned throughout the suite
        run: node tests/assert-ci-state.mjs
        env:
          DIRTBAG_BASE_URL: http://127.0.0.1:9400
          DIRTBAG_STYLE: ${{ matrix.style }}

      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: playwright-report-${{ matrix.style }}
          path: |
            tests/playwright-report
            tests/test-results
            ${{ runner.temp }}/dirtbag-playground
          retention-days: 7
