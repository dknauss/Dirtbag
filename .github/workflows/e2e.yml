name: E2E

# Boots WordPress 7.0 in WordPress Playground with the theme + seeded demo
# content, then runs the Playwright smoke + accessibility suite against it.
#
# NOTE: this harness has not been executed in the authoring environment (no
# Node/browser there). Treat the first CI run as the shakedown — the Playground
# CLI flags and the axe baseline (real a11y findings) may need a tweak.

on:
  # Skip the Playground browser suite for docs-only changes: prose, planning
  # notes, and patch artifacts can't affect what the theme renders, and the
  # Playground CLI is flaky enough that running it on docs adds noise, not
  # signal. A change touching any non-doc path still triggers the full suite.
  # (These checks are not required, so skipping never blocks a merge.)
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '.planning/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '.planning/**'
      - '**/*.md'

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Pin the CI blueprint to this commit
        run: sed "s/__REF__/${{ github.event.pull_request.head.sha || github.sha }}/" tests/blueprint.json > tests/blueprint.ci.json

      - name: Install test dependencies
        working-directory: tests
        run: npm install

      - name: Install Playwright Chromium
        working-directory: tests
        run: npx playwright install --with-deps chromium

      - name: Boot WordPress Playground (theme + seeded content)
        run: |
          # Pinned to 3.1.42, the release that fixes the intermittent EBADF /
          # connection-refused boot crash (WordPress/wordpress-playground#3830,
          # fixed by PR #3833 — stale SQLite WAL .ht.sqlite-shm lock cleanup).
          # With the crash fixed a clean boot lands on attempt 1; the retry
          # remains as a guard against the residual file-lock contention the CLI
          # warns about on small (<6-worker) runners.
          free_port() {
            # The server's worker children can outlive a kill of the npx wrapper
            # and keep port 9400 bound, so a naive retry dies with EADDRINUSE.
            # Kill by name and by port, then wait until 9400 is actually free.
            for _ in $(seq 1 15); do
              pkill -f "@wp-playground/cli" 2>/dev/null || true
              { command -v fuser >/dev/null && fuser -k 9400/tcp 2>/dev/null; } || true
              (exec 3<>/dev/tcp/127.0.0.1/9400) 2>/dev/null || return 0
              sleep 1
            done
            return 0
          }
          boot() {
            # Capture the server's own output. A failing `runPHP` boot step
            # reports itself here and nowhere else, so without this a boot
            # failure is unattributable.
            npx @wp-playground/cli@3.1.42 server --port 9400 --blueprint=tests/blueprint.ci.json > /tmp/pg.log 2>&1 &
            echo $! > /tmp/pg.pid
            # Ready only when the homepage renders the seeded featured image (a
            # bare 200 can precede the seed import) AND the seeded author's
            # nicename survived: a flaky boot can empty user identity fields,
            # which later fails the axe link-name gate as a nameless author
            # link. Bail early if the server died.
            #
            # Record each condition separately. Collapsed into one `if`, a
            # timeout could not say whether the theme never installed (a
            # git:directory fetch problem) or installed but never seeded (a
            # runPHP/worker problem) — the two have different fixes.
            : > /tmp/pg.probe
            for i in $(seq 1 60); do
              theme_ok=no; image_ok=no; author_ok=no
              if curl -sfo /dev/null "http://127.0.0.1:9400/wp-content/themes/dirtbag/style.css"; then theme_ok=yes; fi
              if curl -sf http://127.0.0.1:9400/ | grep -q wp-post-image; then image_ok=yes; fi
              if curl -sf 'http://127.0.0.1:9400/wp-json/wp/v2/users?per_page=100' | grep -q '"slug":"roadside-archivist"'; then author_ok=yes; fi
              printf 'after %ss: theme-installed=%s featured-image=%s author-nicename=%s\n' \
                "$(( i * 2 ))" "$theme_ok" "$image_ok" "$author_ok" > /tmp/pg.probe
              if [ "$image_ok" = yes ] && [ "$author_ok" = yes ]; then return 0; fi
              kill -0 "$(cat /tmp/pg.pid)" 2>/dev/null || return 1
              sleep 2
            done
            return 1
          }
          for attempt in 1 2 3; do
            echo "::group::Playground boot attempt $attempt"
            if boot; then echo "seeded after attempt $attempt"; echo "::endgroup::"; exit 0; fi
            echo "boot attempt $attempt failed; retrying" >&2
            # Say why. Without this the only signal is "failed".
            echo "--- diagnostics for attempt $attempt ---" >&2
            echo "HTTP: $(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9400/ 2>&1)" >&2
            echo "last probe state: $(cat /tmp/pg.probe 2>/dev/null || echo '(never probed)')" >&2
            # With WP_DEBUG_DISPLAY on (tests/blueprint.json), a fatal renders
            # into the response body — so capture the body, not just the status.
            # `curl -f` suppresses output on a 5xx, so this one must omit it.
            echo "--- response body (first 60 lines) ---" >&2
            curl -s http://127.0.0.1:9400/ 2>&1 | head -60 >&2 || echo "(no response)" >&2
            echo "--- last 40 lines of the Playground server log ---" >&2
            tail -40 /tmp/pg.log >&2 2>/dev/null || echo "(no server log)" >&2
            echo "::endgroup::"
            kill "$(cat /tmp/pg.pid)" 2>/dev/null || true
            free_port
          done
          echo "::error::Playground failed to boot (wp-post-image + author nicename) after 3 attempts; aborting so the suite does not run against a mis-seeded site."
          exit 1

      - name: Run Playwright (smoke + accessibility)
        working-directory: tests
        run: npm test
        env:
          DIRTBAG_BASE_URL: http://127.0.0.1:9400

      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: tests/playwright-report
          retention-days: 7

  # Per-style accessibility sweep — axe (with color-contrast gated) against each
  # style variation. Playground is in-memory with no persistent wp-cli, so each
  # style gets its own boot: the blueprint applies the variation at boot via
  # playground/apply-style.php (locally this is the tests/axe-styles.sh loop).
  e2e-styles:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        style: [default, terminal, amber-crt, blueprint, hi-vis, minimalist, newspaper]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Generate per-style CI blueprint
        env:
          REF: ${{ github.event.pull_request.head.sha || github.sha }}
          STYLE: ${{ matrix.style }}
        run: node tests/ci-style-blueprint.mjs > tests/blueprint.ci.json

      - name: Install test dependencies
        working-directory: tests
        run: npm install

      - name: Install Playwright Chromium
        working-directory: tests
        run: npx playwright install --with-deps chromium

      - name: Boot WordPress Playground (theme + seed + style)
        run: |
          # Pinned to 3.1.42, the release that fixes the intermittent EBADF /
          # connection-refused boot crash (WordPress/wordpress-playground#3830,
          # fixed by PR #3833 — stale SQLite WAL .ht.sqlite-shm lock cleanup).
          # With the crash fixed a clean boot lands on attempt 1; the retry
          # remains as a guard against the residual file-lock contention the CLI
          # warns about on small (<6-worker) runners.
          free_port() {
            # The server's worker children can outlive a kill of the npx wrapper
            # and keep port 9400 bound, so a naive retry dies with EADDRINUSE.
            # Kill by name and by port, then wait until 9400 is actually free.
            for _ in $(seq 1 15); do
              pkill -f "@wp-playground/cli" 2>/dev/null || true
              { command -v fuser >/dev/null && fuser -k 9400/tcp 2>/dev/null; } || true
              (exec 3<>/dev/tcp/127.0.0.1/9400) 2>/dev/null || return 0
              sleep 1
            done
            return 0
          }
          boot() {
            # Capture the server's own output. A failing `runPHP` boot step
            # reports itself here and nowhere else, so without this a boot
            # failure is unattributable.
            npx @wp-playground/cli@3.1.42 server --port 9400 --blueprint=tests/blueprint.ci.json > /tmp/pg.log 2>&1 &
            echo $! > /tmp/pg.pid
            # Ready only when the homepage renders the seeded featured image (a
            # bare 200 can precede the seed import) AND the seeded author's
            # nicename survived: a flaky boot can empty user identity fields,
            # which later fails the axe link-name gate as a nameless author
            # link. Bail early if the server died.
            #
            # Record each condition separately. Collapsed into one `if`, a
            # timeout could not say whether the theme never installed (a
            # git:directory fetch problem) or installed but never seeded (a
            # runPHP/worker problem) — the two have different fixes.
            : > /tmp/pg.probe
            for i in $(seq 1 60); do
              theme_ok=no; image_ok=no; author_ok=no
              if curl -sfo /dev/null "http://127.0.0.1:9400/wp-content/themes/dirtbag/style.css"; then theme_ok=yes; fi
              if curl -sf http://127.0.0.1:9400/ | grep -q wp-post-image; then image_ok=yes; fi
              if curl -sf 'http://127.0.0.1:9400/wp-json/wp/v2/users?per_page=100' | grep -q '"slug":"roadside-archivist"'; then author_ok=yes; fi
              printf 'after %ss: theme-installed=%s featured-image=%s author-nicename=%s\n' \
